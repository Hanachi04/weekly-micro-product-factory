name: issue-intake

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  triage-issue:
    name: Triage new idea
    runs-on: ubuntu-latest
    env:
      FACTORY_LANG: ${{ vars.FACTORY_LANG || 'ar' }}
    # Only process issues that look like product ideas (label or title prefix)
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'idea') ||
      startsWith(github.event.issue.title, '[فكرة]') ||
      startsWith(github.event.issue.title, '[فكره]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Daily intake rate limit (max 5)
        id: rate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Count workflow runs of this workflow started today
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/issue-intake.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length" 2>/dev/null || echo 0)
          echo "Intake runs today: $COUNT"
          if [ "$COUNT" -gt 5 ]; then
            echo "over_limit=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Daily intake limit reached (5). Skipping build trigger."
          else
            echo "over_limit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Triage Agent
        id: triage
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "🔍 Sorting issue #$ISSUE_NUMBER ..."
          # Write body to file to avoid shell escaping issues
          printf '%s' "$ISSUE_BODY" > /tmp/issue_body.txt
          python agents/triage_agent.py \
            --issue-body "$(cat /tmp/issue_body.txt)" \
            --issue-title "$ISSUE_TITLE" \
            --source github_issue \
            --issue-number "$ISSUE_NUMBER" \
            --lang "$FACTORY_LANG" \
            --output triage_result.json
          echo "──────── triage_result.json ────────"
          cat triage_result.json
          STATUS=$(python3 -c "import json; print(json.load(open('triage_result.json'))['status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          python3 -c "
          import json
          d=json.load(open('triage_result.json'))
          # Write message to file for gh comment (preserve newlines)
          open('/tmp/user_message.md','w',encoding='utf-8').write(d.get('user_message') or '')
          open('/tmp/norm_title.txt','w',encoding='utf-8').write(d.get('normalized_title') or '')
          open('/tmp/norm_desc.txt','w',encoding='utf-8').write(d.get('normalized_description') or '')
          "

      - name: Comment and close if rejected
        if: steps.triage.outputs.status == 'rejected'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/user_message.md
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "rejected" \
            --remove-label "needs-triage" || true
          gh issue close ${{ github.event.issue.number }} --reason "not planned" \
            --comment "$(python3 -c "import sys; sys.path.insert(0,'agents'); from utils.i18n import get_text; import os; print(get_text('vote.close_reject', os.environ.get('FACTORY_LANG')))")"
          echo "❌ Issue rejected and closed"

      - name: Approve, label, and open voting
        if: steps.triage.outputs.status == 'approved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/user_message.md
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "approved" \
            --remove-label "needs-triage" || true

          # Voting ballot (localized; marker is language-agnostic)
          python3 -c "
          import sys
          sys.path.insert(0, 'agents')
          from utils.i18n import get_text
          import os
          open('/tmp/vote_ballot.md','w',encoding='utf-8').write(get_text('vote.ballot', os.environ.get('FACTORY_LANG')))
          "
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/vote_ballot.md
          echo "✅ Idea approved and voting opened (no immediate build — waits for weekly selection)"
