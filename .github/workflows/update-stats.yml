name: update-stats

on:
  workflow_run:
    workflows: ["weekly-build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    name: Generate stats page
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate stats/index.html
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          FACTORY_LANG: ${{ vars.FACTORY_LANG || 'ar' }}
        run: |
          python scripts/generate_stats.py
          ls -la stats/
          wc -c stats/index.html

      - name: Commit and push
        run: |
          git config user.name "Micro Product Factory"
          git config user.email "factory@users.noreply.github.com"
          git add stats/index.html
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "docs(stats): refresh community dashboard"
          git pull --rebase origin main || true
          git push origin main
