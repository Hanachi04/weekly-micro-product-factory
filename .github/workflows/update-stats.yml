name: update-stats

on:
  workflow_run:
    workflows: ["weekly-build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    name: Generate stats page
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate stats/index.html
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          FACTORY_LANG: ${{ vars.FACTORY_LANG || 'ar' }}
          TELEGRAM_CONFIGURED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
        run: |
          python scripts/generate_stats.py
          python scripts/build_dashboard_data.py
          ls -la stats/ dashboard/
          wc -c stats/index.html dashboard/data.json

      - name: Commit and push
        env:
          BRANCH: main
        run: |
          git config user.name "Micro Product Factory"
          git config user.email "factory@users.noreply.github.com"
          git add stats/index.html dashboard/data.json dashboard/index.html
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "docs(stats): refresh community dashboard and control hub data"
          pushed=0
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || { git rebase --abort; echo '::error::rebase conflict'; exit 1; }
            git push origin "HEAD:$BRANCH" && { pushed=1; break; }
            echo "Push attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::push failed after 3 attempts"
            exit 1
          fi
