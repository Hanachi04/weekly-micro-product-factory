name: weekly-build

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      week_id:
        description: 'Week ID (YYYY-wNN). Leave empty for current week'
        required: false
        type: string
        default: ''
      template_name:
        description: 'Deterministic template to use'
        required: false
        type: choice
        options:
          - calculator
          - landing-page
          - weekly-tracker
        default: calculator
      enable_ai:
        description: 'Run smart agents (triage + diversity). Requires API secrets.'
        required: false
        type: boolean
        default: false
      idea_title:
        description: 'Idea title for AI path (optional)'
        required: false
        type: string
        default: 'منتج تجريبي'
      idea_description:
        description: 'Idea description for AI path (optional)'
        required: false
        type: string
        default: 'وصف قصير للمنتج التجريبي'
      source_issue_number:
        description: 'GitHub Issue number that triggered this build (optional)'
        required: false
        type: string
        default: ''
      lang:
        description: 'Factory language (ar or en)'
        required: false
        type: choice
        options:
          - ar
          - en
        default: ar

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  select-idea:
    name: Select community idea
    runs-on: ubuntu-latest
    # On schedule always try; on dispatch only if no explicit idea and enable_ai
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enable_ai == true && inputs.idea_title == 'منتج تجريبي')
    outputs:
      selected: ${{ steps.pick.outputs.selected }}
      issue_number: ${{ steps.pick.outputs.issue_number }}
      idea_title: ${{ steps.pick.outputs.idea_title }}
      idea_description: ${{ steps.pick.outputs.idea_description }}
      votes: ${{ steps.pick.outputs.votes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select highest-voted approved idea
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/select_idea.py selected_idea.json
          SELECTED=$(python3 -c "import json; print(json.load(open('selected_idea.json')).get('selected', False))")
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
          if [ "$SELECTED" = "True" ] || [ "$SELECTED" = "true" ]; then
            python3 -c "
          import json
          d=json.load(open('selected_idea.json'))
          open('/tmp/t','w').write(d.get('idea_title') or '')
          open('/tmp/d','w').write(d.get('idea_description') or '')
          print('issue_number=' + str(d.get('issue_number') or ''))
          print('votes=' + str(d.get('votes') or 0))
          " >> "$GITHUB_OUTPUT"
            echo "idea_title=$(cat /tmp/t)" >> "$GITHUB_OUTPUT"
            # multiline description via EOF
            {
              echo "idea_description<<EOF"
              cat /tmp/d
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Selected issue with votes"
            cat selected_idea.json
          else
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            echo "idea_title=" >> "$GITHUB_OUTPUT"
            echo "idea_description=" >> "$GITHUB_OUTPUT"
            echo "votes=0" >> "$GITHUB_OUTPUT"
            echo "No approved ideas in queue"
          fi


  prepare:
    name: Prepare
    needs: [select-idea]
    if: always() && (needs.select-idea.result == 'success' || needs.select-idea.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      week_id: ${{ steps.set_week.outputs.week_id }}
      target_path: ${{ steps.set_week.outputs.target_path }}
      template_name: ${{ steps.choose_template.outputs.template_name }}
      idea_title: ${{ steps.resolve_idea.outputs.idea_title }}
      idea_description: ${{ steps.resolve_idea.outputs.idea_description }}
      source_issue_number: ${{ steps.resolve_idea.outputs.source_issue_number }}
      use_ai: ${{ steps.resolve_idea.outputs.use_ai }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set week_id
        id: set_week
        run: |
          if [ -n "${{ github.event.inputs.week_id }}" ]; then
            WEEK_ID="${{ github.event.inputs.week_id }}"
            echo "Using input week_id: $WEEK_ID"
          else
            YEAR=$(date -u +%Y)
            WEEK=$(date -u +%V)
            WEEK=$((10#$WEEK))
            WEEK_ID="${YEAR}-w${WEEK}"
            echo "Computed week_id: $WEEK_ID"
          fi

          if ! echo "$WEEK_ID" | grep -qE '^[0-9]{4}-w[0-9]{1,2}(-i[0-9]+)?$'; then
            echo "Invalid week_id format: $WEEK_ID (expected YYYY-wNN or YYYY-wNN-iN)"
            exit 1
          fi

          TARGET_PATH="products/weekly/${WEEK_ID}"
          echo "week_id=${WEEK_ID}" >> "$GITHUB_OUTPUT"
          echo "target_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "week_id=$WEEK_ID"
          echo "target_path=$TARGET_PATH"

      - name: Check product does not exist
        run: |
          TARGET="${{ steps.set_week.outputs.target_path }}"
          if [ -d "$TARGET" ] && [ "$(ls -A "$TARGET" 2>/dev/null)" ]; then
            echo "ERROR: $TARGET already exists. Refusing to overwrite."
            exit 1
          fi
          echo "OK: target path is free"


      - name: Resolve idea source
        id: resolve_idea
        run: |
          INPUT_TITLE="${{ github.event.inputs.idea_title }}"
          INPUT_DESC="${{ github.event.inputs.idea_description }}"
          INPUT_ISSUE="${{ github.event.inputs.source_issue_number }}"
          INPUT_AI="${{ github.event.inputs.enable_ai }}"
          SEL_TITLE="${{ needs.select-idea.outputs.idea_title }}"
          SEL_DESC="${{ needs.select-idea.outputs.idea_description }}"
          SEL_ISSUE="${{ needs.select-idea.outputs.issue_number }}"
          SEL_OK="${{ needs.select-idea.outputs.selected }}"
          EVENT="${{ github.event_name }}"

          echo "debug AI=$INPUT_AI title=$INPUT_TITLE event=$EVENT sel=$SEL_OK"

          if [ "$EVENT" = "schedule" ] && { [ "$SEL_OK" = "true" ] || [ "$SEL_OK" = "True" ]; }; then
            echo "Community-voted idea #$SEL_ISSUE"
            echo "idea_title=$SEL_TITLE" >> "$GITHUB_OUTPUT"
            { echo "idea_description<<EOF"; echo "$SEL_DESC"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "source_issue_number=$SEL_ISSUE" >> "$GITHUB_OUTPUT"
            echo "use_ai=true" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_AI" = "true" ]; then
            echo "Dispatch AI path"
            echo "idea_title=$INPUT_TITLE" >> "$GITHUB_OUTPUT"
            { echo "idea_description<<EOF"; echo "$INPUT_DESC"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "source_issue_number=$INPUT_ISSUE" >> "$GITHUB_OUTPUT"
            echo "use_ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deterministic path"
            echo "idea_title=" >> "$GITHUB_OUTPUT"
            echo "idea_description=" >> "$GITHUB_OUTPUT"
            echo "source_issue_number=$INPUT_ISSUE" >> "$GITHUB_OUTPUT"
            echo "use_ai=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose template
        id: choose_template
        run: |
          INPUT_TEMPLATE="${{ github.event.inputs.template_name }}"
          if [ -n "$INPUT_TEMPLATE" ]; then
            TEMPLATE="$INPUT_TEMPLATE"
            echo "Template from input: $TEMPLATE"
          else
            mapfile -t TEMPLATES < <(ls -d templates/*/ 2>/dev/null | xargs -n1 basename)
            if [ ${#TEMPLATES[@]} -eq 0 ]; then
              echo "ERROR: no templates found"
              exit 1
            fi
            IDX=$((RANDOM % ${#TEMPLATES[@]}))
            TEMPLATE="${TEMPLATES[$IDX]}"
            echo "Random template: $TEMPLATE"
          fi

          if [ ! -d "templates/$TEMPLATE" ] || [ ! -f "templates/$TEMPLATE/index.html" ]; then
            echo "ERROR: templates/$TEMPLATE/index.html missing"
            exit 1
          fi

          echo "template_name=${TEMPLATE}" >> "$GITHUB_OUTPUT"
          echo "Selected template: $TEMPLATE"

  smart-agents:
    name: Smart Agents
    needs: prepare
    if: ${{ needs.prepare.outputs.use_ai == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enable_ai == true) }}
    runs-on: ubuntu-latest
    env:
      FACTORY_LANG: ${{ github.event.inputs.lang || vars.FACTORY_LANG || 'ar' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Triage Agent
        id: triage
        run: |
          echo "🔍 Running Triage Agent..."
          python agents/triage_agent.py \
            --title "${{ needs.prepare.outputs.idea_title }}" \
            --description "${{ needs.prepare.outputs.idea_description }}" \
            --source github_issue \
            --issue-number "${{ needs.prepare.outputs.source_issue_number }}" \
            --output triage_result.json
          echo "──────── triage_result.json ────────"
          cat triage_result.json
          STATUS=$(python3 -c "import json; print(json.load(open('triage_result.json'))['status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "approved" ]; then
            echo "❌ Idea rejected by triage"
            exit 1
          fi
          echo "✅ Idea approved"

      - name: Run Diversity Agent
        run: |
          echo "🎲 Running Diversity Agent..."
          TITLE=$(python3 -c "import json; print(json.load(open('triage_result.json'))['normalized_title'])")
          DESC=$(python3 -c "import json; print(json.load(open('triage_result.json'))['normalized_description'])")
          python agents/diversity_agent.py \
            --idea-title "$TITLE" \
            --idea-description "$DESC" \
            --catalog catalog/index.json \
            --output diversity_card.json
          echo "──────── diversity_card.json ────────"
          cat diversity_card.json
          echo "✅ Diversity card generated"


      - name: Run Content Agent
        run: |
          echo "Content Agent starting..."
          TITLE=$(python3 -c "import json; print(json.load(open('triage_result.json'))['normalized_title'])")
          DESC=$(python3 -c "import json; print(json.load(open('triage_result.json'))['normalized_description'])")
          python agents/content_agent.py \
            --idea-title "$TITLE" \
            --idea-description "$DESC" \
            --diversity diversity_card.json \
            --output content.json
          echo "--- content.json ---"
          cat content.json
          echo "Content generated"

      - name: Run Design Agent
        run: |
          echo "Design Agent starting..."
          python agents/design_agent.py \
            --diversity diversity_card.json \
            --content content.json \
            --templates-dir templates \
            --output generated_index.html
          echo "Design HTML generated"
          wc -c generated_index.html

      - name: Upload agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-outputs-${{ needs.prepare.outputs.week_id }}
          path: |
            triage_result.json
            diversity_card.json
            content.json
            generated_index.html
          retention-days: 14

  build:
    name: Build
    needs: [prepare, smart-agents]
    if: always() && needs.prepare.result == 'success' && (needs.smart-agents.result == 'success' || needs.smart-agents.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AI artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.use_ai == 'true' && needs.smart-agents.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: agent-outputs-${{ needs.prepare.outputs.week_id }}
          path: ai_out
        continue-on-error: true

      - name: Assemble product
        id: copy
        run: |
          WEEK_ID="${{ needs.prepare.outputs.week_id }}"
          TARGET="${{ needs.prepare.outputs.target_path }}"
          TEMPLATE="${{ needs.prepare.outputs.template_name }}"
          ENABLE_AI="${{ needs.prepare.outputs.use_ai }}"

          echo "Building product for week: $WEEK_ID"
          mkdir -p "$TARGET"

          BUILD_METHOD="deterministic"
          TITLE=""
          DESC=""

          if [ "$ENABLE_AI" = "true" ] && [ -f ai_out/generated_index.html ]; then
            echo "Using AI-generated HTML from Design Agent"
            cp ai_out/generated_index.html "$TARGET/index.html"
            BUILD_METHOD="ai_generated"
            if [ -f ai_out/content.json ]; then
              TITLE=$(python3 -c "import json; print(json.load(open('ai_out/content.json')).get('title',''))")
              DESC=$(python3 -c "import json; print(json.load(open('ai_out/content.json')).get('description',''))")
            fi
            cp ai_out/diversity_card.json "$TARGET/diversity_card.json" 2>/dev/null || true
            cp ai_out/content.json "$TARGET/content.json" 2>/dev/null || true
            cp ai_out/triage_result.json "$TARGET/triage_result.json" 2>/dev/null || true
          else
            echo "Using deterministic template: $TEMPLATE"
            cp "templates/$TEMPLATE/index.html" "$TARGET/index.html"
            if [ -f "templates/$TEMPLATE/meta.json" ]; then
              TITLE=$(python3 -c "import json; print(json.load(open('templates/$TEMPLATE/meta.json')).get('name', '$TEMPLATE'))")
              DESC=$(python3 -c "import json; print(json.load(open('templates/$TEMPLATE/meta.json')).get('description', ''))")
            else
              TITLE="$TEMPLATE"
              DESC="Deterministic product from template $TEMPLATE"
            fi
          fi

          if [ -z "$TITLE" ]; then TITLE="$TEMPLATE"; fi
          if [ -z "$DESC" ]; then DESC="Weekly micro-product"; fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          export B_TITLE="$TITLE" B_DESC="$DESC" B_WEEK="$WEEK_ID" B_TEMPLATE="$TEMPLATE" B_METHOD="$BUILD_METHOD" B_TS="$TIMESTAMP" B_TARGET="$TARGET" B_ISSUE="${{ inputs.source_issue_number }}"
          python3 -c "
          import json, os
          issue = os.environ.get('B_ISSUE') or None
          data = {
            'week': os.environ['B_WEEK'],
            'title': os.environ['B_TITLE'],
            'description': os.environ['B_DESC'],
            'path': os.environ['B_TEMPLATE'],
            'build_method': os.environ['B_METHOD'],
            'generated_at': os.environ['B_TS'],
            'source_issue_number': issue if issue else None,
            'quality_score': None,
            'diversity_score': None,
          }
          with open(os.environ['B_TARGET'] + '/meta.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          "

          SIZE=$(du -sb "$TARGET" | cut -f1)
          SIZE_KB=$((SIZE / 1024))
          echo "Product size: ${SIZE_KB} KB ($SIZE bytes)"
          echo "Build method: $BUILD_METHOD"

          if [ "$SIZE" -gt 81920 ]; then
            echo "ERROR: size exceeds 80 KB"
            exit 1
          fi
          echo "Size OK (< 80 KB)"
          ls -la "$TARGET"
          cat "$TARGET/meta.json"


  validate:
    name: Validate
    needs: [prepare, build, smart-agents]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML structure and size
        run: |
          TEMPLATE="${{ needs.prepare.outputs.template_name }}"
          FILE="templates/$TEMPLATE/index.html"

          echo "Validating template: $TEMPLATE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: index.html missing"
            exit 1
          fi

          if ! grep -qi '<html' "$FILE"; then
            echo "ERROR: missing <html> tag"
            exit 1
          fi
          if ! grep -qi '<body' "$FILE"; then
            echo "ERROR: missing <body> tag"
            exit 1
          fi
          echo "HTML structure OK"

          if grep -qi 'dir="rtl"' "$FILE" || grep -qi "dir='rtl'" "$FILE"; then
            echo "RTL support present"
          else
            echo "WARNING: no dir=rtl found"
          fi

          SIZE=$(du -sb "templates/$TEMPLATE" | cut -f1)
          SIZE_KB=$((SIZE / 1024))
          echo "Template size: ${SIZE_KB} KB"
          if [ "$SIZE" -gt 81920 ]; then
            echo "ERROR: size exceeds 80 KB"
            exit 1
          fi
          echo "Validation passed"

      - name: Download AI for soft checks
        if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.use_ai == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-outputs-${{ needs.prepare.outputs.week_id }}
          path: ai_check

      - name: AI soft quality review
        if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.use_ai == 'true' }}
        continue-on-error: true
        run: |
          if [ ! -f ai_check/generated_index.html ]; then
            echo "No AI HTML artifact — skip soft checks"
            exit 0
          fi
          echo "Soft AI quality review..."
          SIZE=$(wc -c < ai_check/generated_index.html)
          echo "AI HTML size: $SIZE bytes"
          if [ "$SIZE" -gt 81920 ]; then
            echo "WARNING: AI HTML exceeds 80KB"
          fi
          if [ -f ai_check/diversity_card.json ]; then
            python3 -c "
          import json, pathlib
          card = json.loads(pathlib.Path('ai_check/diversity_card.json').read_text())
          html = pathlib.Path('ai_check/generated_index.html').read_text()
          palette = card.get('suggested_palette') or []
          found = [c for c in palette if c.lower() in html.lower()]
          print('Palette found:', found, '/', palette)
          if palette and not found:
              print('WARNING: none of suggested_palette colors found')
          else:
              print('OK palette check')
          forbidden = card.get('forbidden_patterns') or []
          hits = [p for p in forbidden if p and str(p).lower() in html.lower()]
          if hits:
              print('WARNING forbidden pattern hits:', hits)
          else:
              print('OK forbidden patterns')
          "
          fi


  publish:
    name: Publish
    needs: [prepare, build, validate]
    if: always() && needs.build.result == 'success' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AI artifacts for publish
        if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.use_ai == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: agent-outputs-${{ needs.prepare.outputs.week_id }}
          path: ai_out
        continue-on-error: true

      - name: Assemble product files
        run: |
          WEEK_ID="${{ needs.prepare.outputs.week_id }}"
          TARGET="${{ needs.prepare.outputs.target_path }}"
          TEMPLATE="${{ needs.prepare.outputs.template_name }}"
          ENABLE_AI="${{ needs.prepare.outputs.use_ai }}"
          mkdir -p "$TARGET"
          BUILD_METHOD="deterministic"
          TITLE=""
          DESC=""
          if [ "$ENABLE_AI" = "true" ] && [ -f ai_out/generated_index.html ]; then
            echo "Publishing AI-generated product"
            cp ai_out/generated_index.html "$TARGET/index.html"
            BUILD_METHOD="ai_generated"
            if [ -f ai_out/content.json ]; then
              TITLE=$(python3 -c "import json; print(json.load(open('ai_out/content.json')).get('title',''))")
              DESC=$(python3 -c "import json; print(json.load(open('ai_out/content.json')).get('description',''))")
            fi
            cp ai_out/diversity_card.json "$TARGET/" 2>/dev/null || true
            cp ai_out/content.json "$TARGET/" 2>/dev/null || true
            cp ai_out/triage_result.json "$TARGET/" 2>/dev/null || true
          else
            cp "templates/$TEMPLATE/index.html" "$TARGET/index.html"
            if [ -f "templates/$TEMPLATE/meta.json" ]; then
              TITLE=$(python3 -c "import json; print(json.load(open('templates/$TEMPLATE/meta.json')).get('name', '$TEMPLATE'))")
              DESC=$(python3 -c "import json; print(json.load(open('templates/$TEMPLATE/meta.json')).get('description', ''))")
            else
              TITLE="$TEMPLATE"
              DESC="Deterministic product from template $TEMPLATE"
            fi
          fi
          if [ -z "$TITLE" ]; then TITLE="$TEMPLATE"; fi
          if [ -z "$DESC" ]; then DESC="Weekly micro-product"; fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ISSUE_NO="${{ needs.prepare.outputs.source_issue_number }}"
          if [ -z "$ISSUE_NO" ]; then ISSUE_NO="${{ inputs.source_issue_number }}"; fi
          export P_TITLE="$TITLE" P_DESC="$DESC" P_WEEK="$WEEK_ID" P_TEMPLATE="$TEMPLATE" P_METHOD="$BUILD_METHOD" P_TS="$TIMESTAMP" P_TARGET="$TARGET" P_ISSUE="$ISSUE_NO" P_LANG="${{ github.event.inputs.lang || vars.FACTORY_LANG || 'ar' }}"
          python3 -c "
          import json, os
          data = {
            'week': os.environ['P_WEEK'],
            'title': os.environ['P_TITLE'],
            'description': os.environ['P_DESC'],
            'path': os.environ['P_TEMPLATE'],
            'build_method': os.environ['P_METHOD'],
            'generated_at': os.environ['P_TS'],
            'source_issue_number': os.environ.get('P_ISSUE') or None,
            'lang': os.environ.get('P_LANG') or 'ar',
            'quality_score': None,
            'diversity_score': None,
          }
          with open(os.environ['P_TARGET'] + '/meta.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          "
          echo "Product files ready (method=$BUILD_METHOD)"
          ls -la "$TARGET"
          cat "$TARGET/meta.json"

      - name: Update catalog
        run: |
          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone

          week_id = "${{ needs.prepare.outputs.week_id }}"
          template = "${{ needs.prepare.outputs.template_name }}"
          target = "${{ needs.prepare.outputs.target_path }}"
          catalog_path = "catalog/index.json"

          with open(f"{target}/meta.json", encoding="utf-8") as f:
              product_meta = json.load(f)

          if os.path.exists(catalog_path):
              with open(catalog_path, encoding="utf-8") as f:
                  catalog = json.load(f)
          else:
              catalog = {"products": [], "last_updated": None, "total_count": 0}

          catalog["products"] = [p for p in catalog.get("products", []) if p.get("week") != week_id]

          # enrich diversity tags from card if present
          tags = []
          card_path = f"{target}/diversity_card.json"
          if os.path.exists(card_path):
              try:
                  card = json.load(open(card_path, encoding="utf-8"))
                  layout = (card.get("required_layout") or "")[:40]
                  tone = (card.get("tone_of_voice") or "")[:40]
                  if layout:
                      tags.append(layout)
                  if tone:
                      tags.append(tone)
                  for c in (card.get("suggested_palette") or [])[:3]:
                      tags.append(str(c))
              except Exception:
                  pass
          entry = {
              "week": product_meta["week"],
              "title": product_meta["title"],
              "description": product_meta["description"],
              "path": target,
              "template": template,
              "build_method": product_meta.get("build_method", "deterministic"),
              "generated_at": product_meta["generated_at"],
              "source_issue_number": product_meta.get("source_issue_number"),
              "diversity_tags": tags,
              "votes": product_meta.get("votes"),
              "lang": product_meta.get("lang") or "ar",
          }
          catalog["products"].insert(0, entry)
          catalog["total_count"] = len(catalog["products"])
          catalog["last_updated"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)

          print("Catalog updated. Total products:", catalog["total_count"])
          PY

      - name: Commit and push
        run: |
          WEEK_ID="${{ needs.prepare.outputs.week_id }}"
          TARGET="${{ needs.prepare.outputs.target_path }}"
          TEMPLATE="${{ needs.prepare.outputs.template_name }}"

          git config user.name "Micro Product Factory"
          git config user.email "factory@users.noreply.github.com"

          git add "$TARGET" catalog/index.json
          git status

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(product): publish ${WEEK_ID} via ${TEMPLATE} (deterministic)"
            git pull --rebase origin main || true
            git push
            echo "Pushed successfully"
          fi


      - name: Close source issue as produced
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NO="${{ needs.prepare.outputs.source_issue_number }}"
          WEEK_ID="${{ needs.prepare.outputs.week_id }}"
          if [ -z "$ISSUE_NO" ]; then
            echo "No source issue — skip"
            exit 0
          fi
          REPO="${{ github.repository }}"
          PRODUCT_URL="https://github.com/${REPO}/tree/main/products/weekly/${WEEK_ID}"
          STATS_URL="https://github.com/${REPO}/tree/main/stats"
          gh label create produced --color 5319e7 --description "Idea produced by the factory" 2>/dev/null || true
          python3 -c "
          import sys, os
          sys.path.insert(0, 'agents')
          from utils.i18n import get_text
          lang = os.environ.get('FACTORY_LANG') or '${{ github.event.inputs.lang || vars.FACTORY_LANG || 'ar' }}'
          msg = get_text('produce.comment', lang, week='$WEEK_ID', product_url='$PRODUCT_URL', stats_url='$STATS_URL')
          open('/tmp/produced.md','w',encoding='utf-8').write(msg)
          "
          gh issue comment "$ISSUE_NO" --body-file /tmp/produced.md
          gh issue edit "$ISSUE_NO" --add-label "produced" --remove-label "approved" || true
          gh issue close "$ISSUE_NO" --reason "completed" || true
          echo "Closed issue #$ISSUE_NO as produced"

      - name: Summary
        run: |
          WEEK_ID="${{ needs.prepare.outputs.week_id }}"
          TEMPLATE="${{ needs.prepare.outputs.template_name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          echo "========================================"
          echo "Product published successfully"
          echo "========================================"
          echo "Week     : $WEEK_ID"
          echo "Template : $TEMPLATE"
          echo "Product  : https://github.com/${REPO}/tree/${BRANCH}/products/weekly/${WEEK_ID}"
          echo "Page     : https://github.com/${REPO}/blob/${BRANCH}/products/weekly/${WEEK_ID}/index.html"
          echo "========================================"
