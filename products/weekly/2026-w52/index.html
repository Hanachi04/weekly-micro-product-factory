<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متتبع العادات الأسبوعي</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7fafc;color:#1a202c;min-height:100vh;padding:1rem;display:flex;flex-direction:column;align-items:center}
    h1{font-size:1.35rem;color:#2c7a7b;margin:1rem 0 .35rem;text-align:center}
    .sub{font-size:.85rem;color:#718096;margin-bottom:1.25rem;text-align:center}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:1.1rem;width:100%;max-width:360px}
    label{display:block;font-size:.8rem;color:#4a5568;margin-bottom:.35rem}
    input[type=text]{width:100%;padding:.55rem .7rem;border:1px solid #e2e8f0;border-radius:8px;font-size:1rem;margin-bottom:1rem;direction:rtl}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:center;padding:.55rem .2rem;font-size:.85rem}
    th{color:#4a5568;font-weight:600}
    td button{width:36px;height:36px;border:2px solid #e2e8f0;border-radius:50%;background:#f7fafc;cursor:pointer;font-size:1rem;transition:all .15s}
    td button.done{background:#38b2ac;border-color:#38b2ac;color:#fff}
    .actions{display:flex;gap:.5rem;margin-top:1rem}
    .actions button{flex:1;padding:.6rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer}
    .save{background:#2c7a7b;color:#fff}
    .reset{background:#fed7d7;color:#c53030}
    .msg{text-align:center;font-size:.8rem;color:#38b2ac;margin-top:.6rem;min-height:1.2em}
  </style>
</head>
<body>
  <h1>متتبع العادات الأسبوعي</h1>
  <p class="sub">سجّل عادة واحدة وتتبعها طوال الأسبوع — يعمل بدون إنترنت</p>
  <div class="card">
    <label for="habit">اسم العادة</label>
    <input type="text" id="habit" placeholder="مثال: قراءة 20 دقيقة" maxlength="40">
    <table>
      <thead><tr>
        <th>سبت</th><th>أحد</th><th>إثن</th><th>ثلا</th><th>أرب</th><th>خمي</th><th>جمع</th>
      </tr></thead>
      <tbody><tr id="days"></tr></tbody>
    </table>
    <div class="actions">
      <button class="save" onclick="save()">حفظ</button>
      <button class="reset" onclick="resetAll()">إعادة</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
  <script>
    const KEY='habit-tracker-v1';
    const daysEl=document.getElementById('days');
    const habitEl=document.getElementById('habit');
    const msgEl=document.getElementById('msg');
    let state=[false,false,false,false,false,false,false];
    function render(){
      daysEl.innerHTML='';
      state.forEach((d,i)=>{
        const b=document.createElement('td');
        const btn=document.createElement('button');
        btn.textContent=d?'✓':'';
        if(d)btn.classList.add('done');
        btn.onclick=()=>{state[i]=!state[i];render();};
        b.appendChild(btn);daysEl.appendChild(b);
      });
    }
    function save(){
      const data={habit:habitEl.value,days:state};
      try{localStorage.setItem(KEY,JSON.stringify(data));msgEl.textContent='تم الحفظ محلياً ✓';}
      catch(e){msgEl.textContent='تعذر الحفظ';}
      setTimeout(()=>msgEl.textContent='',2000);
    }
    function resetAll(){
      state=[false,false,false,false,false,false,false];
      habitEl.value='';render();
      localStorage.removeItem(KEY);
      msgEl.textContent='تم المسح';
      setTimeout(()=>msgEl.textContent='',1500);
    }
    function load(){
      try{
        const raw=localStorage.getItem(KEY);
        if(raw){const d=JSON.parse(raw);habitEl.value=d.habit||'';state=d.days||state;}
      }catch(e){}
      render();
    }
    load();
  </script>
</body>
</html>
