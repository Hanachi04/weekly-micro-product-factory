<!-- design_agent: fallback | palette=#FF7F50,#32CD32,#1E90FF -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة هبوط بسيطة</title>
  <style>

:root {
  --ai-primary: #FF7F50;
  --ai-secondary: #32CD32;
  --ai-bg: #1E90FF;
}
body { background: var(--ai-bg) !important; }
h1, h2 { color: var(--ai-primary) !important; }
button, .cta, a.cta { background: var(--ai-primary) !important; border-color: var(--ai-primary) !important; }


    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #ebf8ff 0%, #f0fff4 100%);
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .hero {
      max-width: 420px;
    }
    h1 {
      font-size: 1.75rem;
      line-height: 1.35;
      margin-bottom: 0.75rem;
      color: #2b6cb0;
    }
    p {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }
    .cta {
      display: inline-block;
      background: #2b6cb0;
      color: #fff;
      text-decoration: none;
      padding: 0.85rem 1.8rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(43, 108, 176, 0.35);
    }
    .cta:active { transform: scale(0.97); }
    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>قائمة مهامك اليومية</h1>
    <p>صفحة هبوط بسيطة وخفيفة، جاهزة للاستخدام مباشرة من الهاتف، بدون أي مكتبات خارجية.</p>
    <a class="cta" href="#">أضف مهمة</a>
  </div>
  <footer>ابدأ اليوم، حقق أهدافك!</footer>
</body>
</html>
